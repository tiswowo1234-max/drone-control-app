# ============================================================
#  드론 제어 시스템 설정 파일
#  - 실제 환경이 확정되면 이 파일의 숫자만 바꾸면 된다.
#  - 중계 서버가 이 파일을 읽어 앱에 `config` 메시지로 전달한다 (docs/api.md 3.1).
#  - 좌표 단위: cm, 원점 = 바닥 지도 왼쪽 아래, x = 지도 오른쪽, y = 지도 위쪽 (실제 동/북 아님)
#  - 상태 표시:  [임시] 아직 확정 안 된 값 / [확정] 실측·합의된 값
# ============================================================

[map]
# 바닥에 까는 인쇄 지도의 실제 크기 [확정: 2026-11-11, 2.5m x 2.5m로 인쇄 의뢰]
# 원본: map/KAIST_map_PRINT_2500x2500mm.eps (인쇄용), map/KAIST_map_PRINT_preview.pdf (같은 내용)
# 페이지 전체가 지도다(여백 없음). 정문(main_gate) 중심 = 약 (153.2, 70.2) cm
width_cm = 250
height_cm = 250
image = "app/assets/map.png"   # tools/pdf_to_png.py로 생성 (2500x2500px)

[home]
# 이륙·귀환 지점 [확정: 2026-11-11, 정문(main_gate, 지도의 빨간 점)]
# EPS 원 중심 (4341.46, 1989.41) pt → 250 cm / 7086.61 pt 로 환산
x_cm = 153.2
y_cm = 70.2

[limits]
max_radius_cm = 250      # home에서 이 거리보다 먼 목표는 거부 [임시] (정문 기준 가장 먼 지도 모서리 약 236 cm → 지도 전체 포함)
min_alt_cm = 30          # [임시] 2026-11-23: 비행 고도를 낮추며 50 → 30
max_alt_cm = 150         # 시연 공간 천장 높이 확인 후 조정 [임시]
default_alt_cm = 50      # [임시] 2026-11-23: 80 → 50 (TT 하단 320x240 합성 측정: 태그 인식 95%, 위치 나온 화면 66%, 슬롯 촬영 허용 약 ±12cm). fixed_alt면 이 고도로 고정 비행
fixed_alt = true         # [임시] true = goto에 z_cm이 없으면 항상 default_alt_cm으로 비행(현재 고도 유지 대신). 시연 후 결정
min_battery_pct = 20     # 이 값 미만이면 출동 거부
link_timeout_s = 3       # 앱 ping이 이 시간 끊기면 자동 착륙

# 금지 구역 없음 (2026-11-11 결정). 필요해지면 아래 형식으로 추가
# [[no_fly_zones]]
# name = "예시"
# polygon_cm = [[100, 100], [130, 100], [130, 130], [100, 130]]

[geo]
# 지도(map/KAIST_map_PRINT_2500x2500mm.eps = app/assets/map.png, 250x250cm) 네 모서리의 위도·경도 (화면 표시용) [확정]
# 산출: tools/georef.py (2026-11-11) — EPS의 %%MapFeature way 번호로 KAIST_map.osm 노드와 꼭짓점을 직접 대응
#   - way 111개(건물 49, 도로 62), 꼭짓점 965개 → 상사변환 적합, 잔차 평균 0.003 m, 최대 0.015 m
#   - 투영: UTM 52N(EPSG:32652)으로 보임 — 0.97° 회전 = UTM 52N 자오선 수렴각과 일치. 지도 위쪽 ≈ 북쪽
#   - 축척: 지도 1cm = 실제 2.866 m (약 1:287), 지도 전체 = 실제 약 716.6 m 정사각형
#   - 정문(main_gate) 지도 (153.2, 70.2)cm = 위도 36.3658066, 경도 127.3637787
# 위경도는 네 모서리 쌍선형 보간으로 구한다 (u, v = 0~1 지도 비율 좌표, 오차 0):
#    lat = (1-u)(1-v)·sw + u(1-v)·se + (1-u)v·nw + uv·ne  (lon도 같은 식)
# sw/se/nw/ne는 지도 기준 모서리(왼쪽아래/오른쪽아래/왼쪽위/오른쪽위)
sw_lat = 36.3639270
sw_lon = 127.3589258
se_lat = 36.3640364
se_lon = 127.3669092
nw_lat = 36.3703837
nw_lon = 127.3587905
ne_lat = 36.3704931
ne_lon = 127.3667739
rotation_deg = 0.97   # 지도 +x축이 동쪽에서 반시계로 돈 각도 (참고용)

[backend]
# "sim" = Unity 시뮬레이터, "real" = 실제 RoboMaster TT
mode = "sim"

[sim_calibration]
# 시뮬레이터 좌표(m) ↔ 지도 좌표(cm) 변환 [확정: 2026-11-11 실측, 2.5m×2.5m 확정 지도 기준으로 재계산]
# 산출 방법 (server/tools/sim_calibrate.py로 다시 계산 가능 — [geo]나 시뮬레이터 빌드가 바뀌면 다시 실행):
#   시뮬레이터 장면(UnityProject_Data/level0)의 건물 메시 이름에 OSM way ID가 들어 있다 (예: Building_49931903_0_Roof).
#   건물 메시 중심을 KAIST_map.osm 건물 중심과 맞춰 보니
#     시뮬레이터 = OSM 실제 거리의 약 1/10 (0.0995), 회전 약 0.95°, **동서 거울 반전** (sim +x = 서쪽, +z = 북쪽)
#     (잔차 평균 0.18 m, 최대 1.4 m — 시뮬레이터 m 기준, 69쌍)
#   여기에 [geo]의 지도 네 모서리 위경도를 넣어 지도 모서리의 시뮬레이터 좌표를 구했다.
#     sw(원점) = (35.565, -35.809), se = (-35.628, -35.772), nw = (35.592, 35.697), ne = (-35.601, 35.733)
#   → 지도 250 cm = 시뮬레이터 약 71.3 m (지도 1 cm ≈ 시뮬레이터 0.285 m)
# 변환: (a, b) = (map_x_from, map_y_from 축의 원점 기준 값)
#        지도_x = scale·(a·cos θ + b·sin θ),  지도_y = scale·(-a·sin θ + b·cos θ),  θ = rotation_deg
#        높이도 같은 배율: 지도 z(cm) = 시뮬레이터 높이(m) × scale  → 지도 고도 80 cm = 시뮬레이터 약 22.8 m
#        (지도 자체가 0.97° 돌아 있고 시뮬레이터도 OSM에서 0.95° 돌아 있어 둘이 거의 상쇄 → θ ≈ 0)
# 주의: 시뮬레이터 바닥은 x ±35.8 m, z ±33.9 m. 지도의 아래쪽 띠(y < 약 6.8 cm)와 위쪽 띠(y > 약 244.1 cm)는
#       바닥 밖이다 (x 방향은 지도 전체가 바닥 안). 그 띠에 착륙하면 드론이 떨어진다.
#       시뮬레이터 드론 시작 위치 (0, -2.5) = 지도 약 (124.7, 116.6) cm — home(정문 153.2, 70.2)과 다르다.
origin_x_m = 35.565      # 지도 원점(왼쪽 아래)에 해당하는 시뮬레이터 x
origin_z_m = -35.809     # 지도 원점(왼쪽 아래)에 해당하는 시뮬레이터 z
scale_cm_per_m = 3.504   # 시뮬레이터 1m가 지도 몇 cm인지
map_x_from = "-x"        # 회전 전 기준 축 a: 시뮬레이터 -x = 동쪽 (거울 반전 때문에 -)
map_y_from = "+z"        # 회전 전 기준 축 b: 시뮬레이터 +z = 북쪽
rotation_deg = 0.03      # 지도 +x가 시뮬레이터 동쪽(-x)에서 반시계로 돈 각도

# ------------------------------------------------------------
#  중계 서버 (server/) 설정
# ------------------------------------------------------------
[server]
host = "0.0.0.0"         # 0.0.0.0 = 같은 Wi-Fi의 폰에서 접속 허용
port = 8000
state_hz = 5             # 앱으로 state를 보내는 횟수(초당)

[mock]
# Unity 없이 순수 Python으로 흉내 내는 가짜 드론 (python run_server.py mock)
speed_cm_s = 50                         # 수평 이동 속도
vertical_speed_cm_s = 40                # 이착륙 속도
takeoff_height_cm = 100                 # 이륙 직후 높이 (TT 실제 동작과 비슷하게)
battery_start_pct = 100
battery_drain_flying_pct_per_min = 6    # 비행 중 배터리 감소
battery_drain_idle_pct_per_min = 0.5
time_scale = 1.0                        # 1보다 크면 그만큼 빨리 진행 (테스트용)
pos_source = "estimate"                 # "estimate" = 가짜 드론 자체 위치 / "vision" = POST /vision/pose 값 (run_server.bat mock --vision 과 같음)

[sim]
# Unity 시뮬레이터 백엔드 (python run_server.py sim) — UnityProject.exe를 먼저 켠다
host = "127.0.0.1"
port = 9911
pos_source = "estimate"   # "estimate" = 명령 누적 추정(실제 드론과 같은 조건) / "sim_truth" = 시뮬레이터 참값 / "vision" = 카메라 위치 추정 입력
speed_cm_s = 100          # go 명령 속도 (10~100, 시뮬레이터 cm/s). 시뮬레이터 세계가 커서(지도 1cm ≈ 25 시뮬 cm) 최대로
segment_cm = 200          # 한 번에 보내는 최대 이동 거리(시뮬레이터 cm, 약 2초). 짧을수록 정지 버튼이 빨리 먹힘 (시뮬레이터는 진행 중 명령을 못 끊음)
go_axes = "sim"           # 시뮬레이터의 go는 (a=오른쪽, b=전진) — 실제 SDK(x=전진, y=왼쪽)와 다름 [확정: 2026-11-11 실측]
simulator_python_dir = "RoboMasterTT-Simulator beta/Python"
auto_reset_after_emergency = true   # 비상정지 후 다음 이륙 때 시뮬레이터를 자동 리셋(드론이 시작 위치로 돌아감)
max_height_cm = 2800       # 시뮬레이터 높이 센서(h)가 약 29.8 m에서 멈춰 그 위로는 고도를 알 수 없음 → 28 m(지도 약 98 cm)로 제한
land_descend_to_cm = 100  # 착륙 전에 시뮬레이터 높이 1 m까지 go로 먼저 내려옴 (20 m에서 바로 land하면 시간 초과)

[real]
# 실제 RoboMaster TT 백엔드 (python run_server.py real) — PC/라즈베리파이를 TT Wi-Fi에 연결
pos_source = "estimate"   # "estimate" / "vision" = 카메라 위치 추정(조원 코드 → POST /vision/pose) / "mission_pad"
speed_cm_s = 15           # [임시] 2026-11-23: 30 → 15 (위치 오차 줄이려 느리게). 구간 50cm면 한 구간 약 4초(TT 응답 제한 7초 안)
segment_cm = 50
go_axes = "sdk"
alt_source = "tof"        # [2026-11-23] 고도 = 거리 센서(바닥까지 직접 잰 값). TT h(이륙 기준 추정)는 시험에서 30cm 틀림. tof 15cm 미만이면 h 사용
heading_from_vision = true # [2026-11-23] 카메라로 잰 드론 방향으로 TT 방향 센서를 보정해 이동 방향 계산(켤 때 방향이 지도 위쪽이 아니어도 됨)
keepalive_s = 5.0         # [확정: 2026-11-21 실물] 비행 중 5초 동안 명령이 없으면 'rc 0 0 0 0'(제자리)을 보냄. TT는 15초 무명령이면 스스로 착륙함
ground_h_cm = 10.0        # [임시] 비행 중인데 TT 높이(h)가 이 값 이하로 ground_s초 이어지면 '스스로 착륙'으로 보고 앱에 알림
ground_s = 1.0            # [임시]
face_target = true        # [2026-11-25 임시] 이동 전 목표 쪽으로 기수를 돌린 뒤(cw/ccw) 주로 '전진'으로 이동. 남은 거리·각도가 아래보다 작으면 돌지 않음
face_min_dist_cm = 30.0   # [임시] 남은 수평 거리가 이보다 짧으면 돌지 않음
face_min_deg = 10.0       # [임시] 목표 방향과 기수 차이가 이보다 작으면 돌지 않음
face_settle_s = 0.5       # [임시] 회전 뒤 센서·카메라 안정 대기

[align]
# 초기 정렬 (2026-11-25): 연결 후 첫 이륙 때 가장 가까운 AprilTag 위로 가서 카메라 위치·방향 보정을 확정한 뒤 출동.
# 정렬 중 앱 모드는 '이륙 중'(출동 명령은 잠시 거부). 실패하면 앱에 알리고 추정 위치로 계속 비행. 카메라 위치(vision)가 없으면 건너뜀.
enabled = true
tags_file = ""            # 비우면 연결 프로그램과 같은 태그 지도(조원 원본 ID 0~38, [bridge] extra_tags = true면 확장판)
max_tag_dist_cm = 80.0    # [임시] 가장 가까운 태그가 이보다 멀면 건너뜀 (정문 home에서 가장 가까운 태그 = ID 37, 약 22cm)
wait_fix_s = 3.0          # [임시] 이륙 직후 첫 카메라 위치를 기다리는 시간
min_fixes = 5             # [임시] 태그 위에서 이만큼(신뢰도 min_confidence 이상) 카메라 위치를 받으면 완료
min_confidence = 0.6
require_heading = true    # real: 카메라 방향 보정값([real] heading_from_vision)이 정해져야 완료
timeout_s = 10.0          # [임시] 태그 위에서 이 시간 안에 완료 못 하면 '정렬 실패' 알림 후 계속

# 미션패드 위치 (pos_source = "mission_pad"일 때). 패드 번호(mid)별 지도 좌표와 회전 [임시]
# [[mission_pads]]
# mid = 1
# x_cm = 20
# y_cm = 20
# rot_deg = 0

[vision]
# 카메라 위치 추정 입력 (조원 코드 → POST http://<서버>:8000/vision/pose, docs/api.md 7장)
# 켜는 법: 백엔드의 pos_source = "vision" 또는 run_server.bat mock --vision
stale_s = 1.0           # 마지막 값을 받은 뒤 이 시간(초)이 지나면 명령 누적 추정으로 이어 감 [임시: 조원 송신 빈도 미정]
min_confidence = 0.0    # confidence가 이보다 낮으면 거부 (LOW_CONFIDENCE) [임시]
margin_m = 0.1          # 지도(0~2.5 m) 밖 이만큼까지는 받아 줌 (추정 오차 여유) [임시]

# ------------------------------------------------------------
#  2단계 (2026-11-21~): 카메라 → vision/ → 서버 → 앱 (docs/api.md 7~10장)
#  키를 추가하면 서버(server/drone_server/settings.py)·연결 프로그램(vision/bridge/config.py)·
#  앱(config 메시지, app/lib/config.dart) 중 읽는 쪽을 함께 고친다 (docs/dev-guide.md 7장).
# ------------------------------------------------------------
[video]
# 실시간 영상 (vision/ → ws /vision/video → 서버 → ws /ws/video → 앱)
send_fps = 10            # vision/ 연결 프로그램이 서버로 보내는 초당 장수 [임시]
send_width_px = 320      # 보낼 때 가로 크기(세로는 비율 유지) [임시]
jpeg_quality = 70        # 보낼 때 JPEG 품질 1~100 [임시]
max_frame_kb = 300       # 이보다 큰 장은 서버가 버림
max_fps = 10             # 서버가 앱 하나에 보내는 초당 최대 장수 [임시]
stale_s = 2.0            # 이 시간 동안 새 장이 없으면 앱에 "영상 끊김" 알림 [임시]

[incident]
# 사건 사진 보고 (vision/ → POST /vision/incident → 서버 → 앱 incident 메시지, docs/api.md 9장)
method = "slot"          # "slot" = 슬롯 위에서 멈추면 슬롯 영역을 잘라 보고(기본) / "photo_finder" = 조원 사진 찾기(나중 시험용)
min_slot_px = 25         # 화면 속 슬롯의 짧은 변이 이 크기(px) 이상일 때만 보고 [임시: 고도 80cm에서 esp32 약 29~30px, tt_down 약 35px — 30은 경계라 25로]
slot_margin_px = 4       # 슬롯 네 모서리가 화면 가장자리에서 이만큼 안쪽에 있어야 함 [임시]
still_s = 1.0            # 이 시간 동안 [임시]
still_cm = 5             # 드론 이동이 이 거리 이하일 때(호버링) 보고 [임시]
crop_width_px = 480      # 잘라낸 사진을 이 폭으로 펴서 보냄(작게 찍혀도 앱에서 보기 쉽게 확대) [임시]
report_cooldown_s = 30   # vision/: 같은 슬롯을 다시 보고하기까지 기다리는 시간 [임시]
same_place_m = 0.15      # 슬롯이 없을 때(사진 찾기 방식) 이 거리 안의 사진은 같은 사진으로 봄 [임시]
dedup_s = 30             # 서버: 같은 슬롯/장소가 이 시간 안에 다시 오면 중복으로 무시 [임시]
keep = 20                # 서버가 기억하는 최근 사건 수 (메모리에만, 재시작하면 사라짐)
max_photo_kb = 500       # 사진 한 장 최대 크기
detect = false           # AI(LLM) 판별 사용 여부. 현재 끔 (2026-11-21 결정). 켜려면 API 키·비용 문제를 먼저 정한다

[bridge]
# vision/ 연결 프로그램 설정 (docs/api.md 8·11·12장)
server_url = "http://127.0.0.1:8000"   # 중계 서버 주소 (같은 노트북이면 127.0.0.1)
default_mode = "tt_down"               # 서버를 켰을 때의 위치 추적 모드: "esp32" / "tt_down". 앱에서 바꿀 수 있다 (동시 사용 안 함) [임시]
pose_send_hz = 5                       # 서버로 위치를 보내는 최대 횟수(초당). [vision] stale_s 안에 2번 이상이 되도록 [임시]
synthetic_camera = "auto"              # "auto" = mock/sim 서버면 합성 카메라(12장), real이면 실제 카메라 / "on" / "off"

# esp32 모드: XIAO ESP32 카메라(컬러) → 조원 localization_app (건물·도로 색 정합 + AprilTag 융합)
esp32_camera_url = ""                  # 예: "http://192.168.0.50:81/stream" (공식 CameraWebServer 예제는 :81) [임시: 실행 때 --esp32-url로도 지정]
esp32_localization = "fusion"          # "map" / "apriltag" / "fusion"
esp32_hfov_deg = 68.0                  # [임시: 조원 코드 기본값] XIAO 카메라 시야각. 보정하면 그 값으로
# esp32 색·조명 보정 [임시: 조원 실물 XIAO + 지도 표본 시험값(2026-11-20 README). 2.5m 실제 인쇄 지도에서 다시 확인]
# 카메라가 읽은 건물색의 Hue가 조금 틀어져 있어, Hue를 보정한 뒤 비슷한 색을 15단위로 묶어 비교한다
esp32_hue_shift = 3                    # 관측 Hue에 더하는 값 (OpenCV 0~179)
esp32_hue_band_width = 15              # 비슷한 색을 이 폭으로 묶음 (0 = 묶지 않음)
esp32_hue_tolerance = 7                # 조원 기본값
esp32_saturation_tolerance = 78        # 조원 기본 55 → XIAO 시험값 78
esp32_value_tolerance = 95             # 조원 기본값
esp32_illumination = "combined"        # 조명 보정: "none" / "clahe" / "constancy" / "field" / "combined" (조원 실물 시험 기본 combined)
esp32_shadow_aware = true              # 그림자 픽셀의 정합 가중치를 줄임 (조원 실물 시험 기본 켬)
esp32_width_px = 320                   # 조원 실측 기준 XIAO 스트림 크기 [임시]
esp32_height_px = 240

# tt_down 모드: TT 내장 하단 카메라(흑백 320x240) → 조원 incident_detection (AprilTag 위치)
tt_video_url = "udp://0.0.0.0:11111"   # TT 영상(H.264)이 노트북에 들어오는 주소. 영상 켜기(streamon, downvision 1)는 서버가 한다
tt_width_px = 320
tt_height_px = 240
tt_mount_yaw_deg = -90.0               # [확정: 2026-11-21 사용자 실물 확인] 드론 앞쪽 = 카메라 화면 위쪽 + 이 값(도, 시계 +).
                                       # 앞쪽을 가리키는 화살표가 화면에서 반시계 90° 돌아(왼쪽을 향해) 보였음 → -90
esp32_mount_yaw_deg = 0.0              # [임시] XIAO를 화면 위쪽 = 드론 앞쪽으로 달면 0. 달고 나서 화살표로 확인
tag_log = true                         # [임시: 태그 인식 시험 중] 태그를 읽으면 연결 프로그램 창에 번호·크기(px)·위치·높이·방향 출력
tag_log_every_s = 0.5                  # 같은 태그가 계속 보일 때 출력 간격(초)
tilt_log_every_s = 1.0                 # 태그가 안 보일 때 [자세](TT 기울기·거리 센서) 줄 출력 간격(초, tt_down·tag_log 켬일 때)
video_forward_up = true                # 앱 영상을 드론 앞쪽이 위로 오게 돌려서 보냄(위치 계산 화면은 그대로)
extra_tags = false                     # [2026-11-23 보류] true = 슬롯 보드 태그(ID 39~54, 슬롯 S1~S4 옆 4개씩) 사용. 보드를 인쇄·부착한 뒤 켤 것
                                       # (vision/data/maps/의 확장 배치 파일·지도 그림 사용, 조원 원본은 그대로. vision/tools/make_slot_boards.py)
tt_use_imu = true                      # [2026-11-23] TT 기울기(pitch·roll)를 위치 계산에 '중력 방향'으로 넣음(조원 코드 gravity_cam, 기울기 ±1.5°로 제한)
tt_pitch_sign = 1.0                    # [확정: 2026-11-23 실물] TT pitch 부호. 기수를 들면 + (맞음)
tt_roll_sign = 1.0                     # [확정: 2026-11-23 실물] TT roll 부호. 오른쪽이 내려가면 + (맞음)
tt_tof_check_cm = 15.0                 # [임시] 카메라 계산 높이와 TT 거리 센서 높이 차가 이보다 크면 그 위치를 버림(0 = 끔)
tt_tof_offset_cm = 0.0                 # [확정: 2026-11-23 실물] 거리 센서 높이가 실제와 비슷함 → 보정 0. 낮은 높이에선 10cm로 고정(센서 하한)되므로 15cm 미만 값은 검사에 안 씀
drone_state_max_age_s = 0.3            # 서버가 보낸 드론 자세가 이보다 오래되면 쓰지 않음
tt_tag_roi = 0.7                       # [임시: 2026-11-23 실물 시험] 태그 중심이 화면 가운데 이 비율(가로·세로) 안에 있는 태그만 위치 계산에 씀.
                                       # 0.5 = 가운데 1/4 넓이(보정 안 된 렌즈의 가장자리 왜곡 회피), 1.0 = 화면 전체. 카메라 보정 후 넓혀 볼 것
tt_crop_top_left = true                # [확정: 사용자 확인 코드] TT 화면은 320x240보다 크게 디코딩되고 실제 영상은 왼쪽 위 320x240뿐(나머지 잡음) → 그 부분만 잘라 씀
tt_hfov_deg = 75.5                     # [2026-11-25 실측 보정] 11-25 16:38 비행 로그: 태그 높이/거리센서 = 1.34(116표본, 중앙 1.36) → 60°에서 보정. 태그 40mm 실측 확인. 더 정밀히는 calibrate_camera.py
tt_camera_file = ""                    # 카메라 보정 결과 JSON 경로 (비어 있으면 tt_hfov_deg로 추정)
photo_search_period_s = 0.2            # 슬롯 촬영 판단·사진 찾기 주기 (조원 코드 기본값)

# ------------------------------------------------------------
#  UGV 따라가기 (2026-11-25~, 1단계 = 인식만). TT 하단 카메라로 UGV 윗면의 AprilTag를 보고 따라간다
#  - 태그: 지도와 같은 tag36h11, **지도에 없는 번호**(지도는 0~38). 인쇄: vision/tools/make_ugv_tag.py
#  - 태그 위쪽(인쇄물의 ▲ 표시)을 UGV 앞쪽으로 붙인다. 다르게 붙였으면 tag_yaw_deg로 보정
#  - 50cm 비행(시야각 75.5°), UGV 높이 15cm 가정: 카메라~태그 35cm, 그 높이의 시야 약 54(드론 앞뒤) x 41cm(좌우), 8cm 태그 ≈ 47px
#  - UGV 태그는 화면 전체에서 찾는다([bridge] tt_tag_roi는 드론 지도 위치 계산에만 적용). 단 렌즈 보정 전이라 가장자리에서는 오차가 커진다
# ------------------------------------------------------------
[ugv]
enabled = true
tag_id = 100              # [임시] UGV 태그 번호 (tag36h11, 0~38은 지도 태그라 쓰면 안 됨)
tag_size_cm = 8.0         # [임시] 태그 검은 사각형 한 변. 인쇄 후 자로 재서 맞춘다 (거리 계산이 이 값에 비례)
height_cm = 15.0          # [임시] 바닥에서 태그(UGV 윗면)까지 높이. UGV 지도 위치 계산에 쓴다
tag_yaw_deg = 0.0         # UGV 앞쪽 = 태그 위쪽 + 이 값 (도, 시계 +)
follow_distance_cm = 12.0 # [임시] UGV 따라가기용: UGV 뒤쪽 이 거리에 떠서 따라감. 50cm 비행이면 태그가 화면 가운데 70% 안(앞쪽 약 19cm)에 머묾
max_tilt_deg = 25.0       # 태그가 이보다 기울어 보이면 잘못 잡은 것으로 보고 버림 (UGV 윗면은 수평)
log_every_s = 1.0         # 인식 결과를 이 간격으로 로그에 출력 (0 = 안 함)
max_height_err_cm = 8.0   # 지도 위치를 서버로 보낼 때: 추정 태그 높이가 height_cm과 이보다 다르면 버림 (이륙·하강 중 드론 위치가 늦게 따라올 때 생기는 큰 오차 방지)

# ------------------------------------------------------------
#  UGV(미니 경찰차) 제어 (2026-11-25~). 조원 police-car-controller(PWA)와 같은 BLE 명령을 서버가 대신 보낸다
#  - 앱 → 서버(WebSocket) → 서버가 BLE로 차의 ESP32-CAM(BLE 이름은 PoliceCar-XIAO 그대로)에 전달 → UART → OpenRB-150(주행)
#  - 차 위치 = 드론이 인식한 UGV 태그 위치([ugv], POST /vision/ugv). 드론이 못 보는 동안은
#    마지막 인식 위치에서 차 엔코더 이동량으로 이어 간다(앱에 "엔코더" 표시). 차 펌웨어는 바꾸지 않는다
# ------------------------------------------------------------
[car]
mode = "ble"              # "ble" = 실제 차 / "mock" = 가짜 차(드론 없이 시험) / "off" = 차 기능 끔. run_server.bat --car mock 으로도 바꿈
ble_name = "PoliceCar-XIAO"  # 차가 광고하는 BLE 이름 (조원 README)
ble_address = ""          # 비우면 이름으로 찾음. 같은 이름 차가 여러 대면 주소(예: "AA:BB:CC:DD:EE:FF")를 넣는다
service_uuid = "8f9a0001-6c2e-4c1a-9d21-55a0a1110000"  # 조원 펌웨어와 같아야 함 (PWA index.html)
rx_uuid = "8f9a0002-6c2e-4c1a-9d21-55a0a1110000"       # 서버 → 차 (명령)
tx_uuid = "8f9a0003-6c2e-4c1a-9d21-55a0a1110000"       # 차 → 서버 (STATUS 알림)
chunk_bytes = 18          # BLE 한 번에 보내는 바이트 (PWA와 같게)
max_speed_mm_s = 100      # 조이스틱·경로 최대 속도 (PWA 30~100)
max_omega_rad_s = 1.5     # 조이스틱 최대 회전 속도 (PWA 0.3~1.5)
route_speed_mm_s = 60     # 경로 주행 기본 속도 (PWA 기본 60)
max_points = 16           # 경로점 최대 (시작점 P0 포함, PWA와 같음)
drive_timeout_s = 0.5     # 조이스틱 명령이 이 시간 끊기면 서버가 STOP을 보냄 (앱은 0.12초마다 보냄)
pose_fresh_s = 1.0        # 드론 인식이 이 시간 안이면 "드론 인식", 지나면 엔코더로 이어 감
route_anchor_max_s = 120  # [임시] 마지막 드론 인식이 이보다 오래되면 경로 주행 거부 (엔코더 오차가 쌓임)
map_margin_cm = 5         # 경로점은 지도 가장자리에서 이만큼 안쪽이어야 함
odom_jump_mm = 300        # 차 엔코더 위치가 한 번에 이보다 많이 바뀌면(차 재부팅) 드론 인식 기준을 버림. 서버가 보낸 RESET_ODOM은 예외
reset_wait_s = 1.5        # 경로를 보낼 때 RESET_ODOM 뒤 원점 근처 STATUS를 기다리는 최대 시간 (펌웨어는 경로 첫 점이 원점이어야 받음)
route_start_timeout_s = 2.0  # START 뒤 이 시간 안에 RUNNING이 안 되면 "경로 시작 안 됨" 알림 (펌웨어는 거부해도 오류를 안 보냄)
# mode = "mock" 전용: 가짜 차가 켜질 때 지도 위치·방향 (지도 위쪽 0°, 시계 +)
mock_start_cm = [120.0, 70.0]
mock_start_yaw_deg = 0.0

