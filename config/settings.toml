# ============================================================
#  드론 제어 시스템 설정 파일
#  - 실제 환경이 확정되면 이 파일의 숫자만 바꾸면 된다.
#  - 중계 서버가 이 파일을 읽어 앱에 `config` 메시지로 전달한다 (docs/api.md 3.1).
#  - 좌표 단위: cm, 원점 = 바닥 지도 왼쪽 아래, x = 지도 오른쪽, y = 지도 위쪽 (실제 동/북 아님)
#  - 상태 표시:  [임시] 아직 확정 안 된 값 / [확정] 실측·합의된 값
# ============================================================

[map]
# 바닥에 까는 인쇄 지도의 실제 크기 [확정: 2026-11-11, 2.5m x 2.5m로 인쇄 의뢰]
# 원본: map/KAIST_map_PRINT_2500x2500mm.eps (인쇄용), map/KAIST_map_PRINT_preview.pdf (같은 내용)
# 페이지 전체가 지도다(여백 없음). 정문(main_gate) 중심 = 약 (153.2, 70.2) cm
width_cm = 250
height_cm = 250
image = "app/assets/map.png"   # tools/pdf_to_png.py로 생성 (2500x2500px)

[home]
# 이륙·귀환 지점 [임시]
x_cm = 20
y_cm = 20

[limits]
max_radius_cm = 250      # home에서 이 거리보다 먼 목표는 거부 [임시]
min_alt_cm = 50          # [임시]
max_alt_cm = 150         # 시연 공간 천장 높이 확인 후 조정 [임시]
default_alt_cm = 80      # [임시]
min_battery_pct = 20     # 이 값 미만이면 출동 거부
link_timeout_s = 3       # 앱 ping이 이 시간 끊기면 자동 착륙

# 금지 구역 없음 (2026-11-11 결정). 필요해지면 아래 형식으로 추가
# [[no_fly_zones]]
# name = "예시"
# polygon_cm = [[100, 100], [130, 100], [130, 130], [100, 130]]

[geo]
# 지도(map/KAIST_map_PRINT_2500x2500mm.eps = app/assets/map.png, 250x250cm) 네 모서리의 위도·경도 (화면 표시용) [확정]
# 산출: tools/georef.py (2026-11-11) — EPS의 %%MapFeature way 번호로 KAIST_map.osm 노드와 꼭짓점을 직접 대응
#   - way 111개(건물 49, 도로 62), 꼭짓점 965개 → 상사변환 적합, 잔차 평균 0.003 m, 최대 0.015 m
#   - 투영: UTM 52N(EPSG:32652)으로 보임 — 0.97° 회전 = UTM 52N 자오선 수렴각과 일치. 지도 위쪽 ≈ 북쪽
#   - 축척: 지도 1cm = 실제 2.866 m (약 1:287), 지도 전체 = 실제 약 716.6 m 정사각형
#   - 정문(main_gate) 지도 (153.2, 70.2)cm = 위도 36.3658066, 경도 127.3637787
# 위경도는 네 모서리 쌍선형 보간으로 구한다 (u, v = 0~1 지도 비율 좌표, 오차 0):
#    lat = (1-u)(1-v)·sw + u(1-v)·se + (1-u)v·nw + uv·ne  (lon도 같은 식)
# sw/se/nw/ne는 지도 기준 모서리(왼쪽아래/오른쪽아래/왼쪽위/오른쪽위)
sw_lat = 36.3639270
sw_lon = 127.3589258
se_lat = 36.3640364
se_lon = 127.3669092
nw_lat = 36.3703837
nw_lon = 127.3587905
ne_lat = 36.3704931
ne_lon = 127.3667739
rotation_deg = 0.97   # 지도 +x축이 동쪽에서 반시계로 돈 각도 (참고용)

[backend]
# "sim" = Unity 시뮬레이터, "real" = 실제 RoboMaster TT
mode = "sim"

[sim_calibration]
# 시뮬레이터 좌표(m) ↔ 지도 좌표(cm) 변환 [확정: 2026-11-11 실측]
# 산출 방법 (server/tools/sim_calibrate.py로 다시 계산 가능):
#   시뮬레이터 장면(UnityProject_Data/level0)의 건물 메시 이름에 OSM way ID가 들어 있다 (예: Building_49931903_0_Roof).
#   건물 75개의 메시 중심을 KAIST_map.osm 건물 중심과 맞춰 보니
#     시뮬레이터 = OSM 실제 거리의 약 1/10 (0.0995), 회전 약 0.9°, **동서 거울 반전** (sim +x = 서쪽, +z = 북쪽)
#     (잔차 평균 0.18 m, 최대 1.4 m — 시뮬레이터 m 기준, 69쌍)
#   여기에 [geo]의 지도 네 모서리 위경도를 넣어 지도 모서리의 시뮬레이터 좌표를 구했다.
#     sw(원점) = (19.54, -37.37), se = (-34.28, -7.36), nw = (41.07, 1.58), ne = (-12.76, 31.59)
#   → 지도 250 cm = 시뮬레이터 61.6 m, 180 cm = 44.5 m (가로·세로 배율 차이 0.3%)
# 변환: (a, b) = (map_x_from, map_y_from 축의 원점 기준 값)
#        지도_x = scale·(a·cos θ + b·sin θ),  지도_y = scale·(-a·sin θ + b·cos θ),  θ = rotation_deg
#        높이도 같은 배율: 지도 z(cm) = 시뮬레이터 높이(m) × scale  → 지도 고도 80 cm = 시뮬레이터 약 20 m
# 주의: 지도 왼쪽 아래·왼쪽 위 모서리 근처는 시뮬레이터 바닥(±35.8 m × ±33.9 m) 밖이다.
#       시뮬레이터 드론 시작 위치 (0, -2.5) = 지도 약 (138, 85) cm.
origin_x_m = 19.541      # 지도 원점(왼쪽 아래)에 해당하는 시뮬레이터 x
origin_z_m = -37.366     # 지도 원점(왼쪽 아래)에 해당하는 시뮬레이터 z
scale_cm_per_m = 4.051   # 시뮬레이터 1m가 지도 몇 cm인지
map_x_from = "-x"        # 회전 전 기준 축 a: 시뮬레이터 -x = 동쪽 (거울 반전 때문에 -)
map_y_from = "+z"        # 회전 전 기준 축 b: 시뮬레이터 +z = 북쪽
rotation_deg = 29.14     # 지도 +x가 동쪽에서 반시계로 돈 각도 (시뮬레이터 기준 실측. [geo] rotation_deg 29.98과 0.8° 차이)

# ------------------------------------------------------------
#  중계 서버 (server/) 설정
# ------------------------------------------------------------
[server]
host = "0.0.0.0"         # 0.0.0.0 = 같은 Wi-Fi의 폰에서 접속 허용
port = 8000
state_hz = 5             # 앱으로 state를 보내는 횟수(초당)

[mock]
# Unity 없이 순수 Python으로 흉내 내는 가짜 드론 (python run_server.py mock)
speed_cm_s = 50                         # 수평 이동 속도
vertical_speed_cm_s = 40                # 이착륙 속도
takeoff_height_cm = 100                 # 이륙 직후 높이 (TT 실제 동작과 비슷하게)
battery_start_pct = 100
battery_drain_flying_pct_per_min = 6    # 비행 중 배터리 감소
battery_drain_idle_pct_per_min = 0.5
time_scale = 1.0                        # 1보다 크면 그만큼 빨리 진행 (테스트용)

[sim]
# Unity 시뮬레이터 백엔드 (python run_server.py sim) — UnityProject.exe를 먼저 켠다
host = "127.0.0.1"
port = 9911
pos_source = "estimate"   # "estimate" = 명령 누적 추정(실제 드론과 같은 조건) / "sim_truth" = 시뮬레이터 참값
speed_cm_s = 100          # go 명령 속도 (10~100, 시뮬레이터 cm/s). 시뮬레이터 세계가 커서(지도 1cm ≈ 25 시뮬 cm) 최대로
segment_cm = 200          # 한 번에 보내는 최대 이동 거리(시뮬레이터 cm, 약 2초). 짧을수록 정지 버튼이 빨리 먹힘 (시뮬레이터는 진행 중 명령을 못 끊음)
go_axes = "sim"           # 시뮬레이터의 go는 (a=오른쪽, b=전진) — 실제 SDK(x=전진, y=왼쪽)와 다름 [확정: 2026-11-11 실측]
simulator_python_dir = "RoboMasterTT-Simulator beta/Python"
auto_reset_after_emergency = true   # 비상정지 후 다음 이륙 때 시뮬레이터를 자동 리셋(드론이 시작 위치로 돌아감)
land_descend_to_cm = 100  # 착륙 전에 시뮬레이터 높이 1 m까지 go로 먼저 내려옴 (20 m에서 바로 land하면 시간 초과)

[real]
# 실제 RoboMaster TT 백엔드 (python run_server.py real) — PC/라즈베리파이를 TT Wi-Fi에 연결
pos_source = "estimate"   # "estimate" / "mission_pad" (조원 구현, server/README.md 참고)
speed_cm_s = 30           # [임시] 실내 3m 공간이라 느리게
segment_cm = 50
go_axes = "sdk"

# 미션패드 위치 (pos_source = "mission_pad"일 때). 패드 번호(mid)별 지도 좌표와 회전 [임시]
# [[mission_pads]]
# mid = 1
# x_cm = 20
# y_cm = 20
# rot_deg = 0
