# ============================================================
#  드론 제어 시스템 설정 파일
#  - 실제 환경이 확정되면 이 파일의 숫자만 바꾸면 된다.
#  - 중계 서버가 이 파일을 읽어 앱에 `config` 메시지로 전달한다 (docs/api.md 3.1).
#  - 좌표 단위: cm, 원점 = 바닥 지도 왼쪽 아래, x = 오른쪽(동), y = 위쪽(북)
#  - 상태 표시:  [임시] 아직 확정 안 된 값 / [확정] 실측·합의된 값
# ============================================================

[map]
# 바닥에 까는 인쇄 지도의 실제 크기 [임시]
# 파일명 KAIST_2500mm_Map.pdf 기준 가로 250cm, 세로는 PDF 비율(약 1.39:1)로 계산
width_cm = 250
height_cm = 179
image = "KAIST_2500mm_Map.pdf"

[home]
# 이륙·귀환 지점 [임시]
x_cm = 20
y_cm = 20

[limits]
max_radius_cm = 250      # home에서 이 거리보다 먼 목표는 거부 [임시]
min_alt_cm = 50          # [임시]
max_alt_cm = 150         # 시연 공간 천장 높이 확인 후 조정 [임시]
default_alt_cm = 80      # [임시]
min_battery_pct = 20     # 이 값 미만이면 출동 거부
link_timeout_s = 3       # 앱 ping이 이 시간 끊기면 자동 착륙

# 금지 구역 없음 (2026-11-11 결정). 필요해지면 아래 형식으로 추가
# [[no_fly_zones]]
# name = "예시"
# polygon_cm = [[100, 100], [130, 100], [130, 130], [100, 130]]

[geo]
# 지도 PDF 네 모서리의 위도·경도 (화면 표시용) [임시]
# PDF는 KAIST_map.osm을 QGIS로 임의 크롭한 것 → PDF 위 건물을 기준점으로 OSM과 맞춰 갱신 예정
# 아래는 OSM 파일 전체 범위(bounds)로 채운 임시값
sw_lat = 36.3642100
sw_lon = 127.3589200
ne_lat = 36.3702100
ne_lon = 127.3667800

[backend]
# "sim" = Unity 시뮬레이터, "real" = 실제 RoboMaster TT
mode = "sim"

[sim_calibration]
# 시뮬레이터 좌표(m) ↔ 지도 좌표(cm) 변환 [임시 — 시뮬레이터 실측 후 갱신]
# 지도_cm = (sim_m - origin_m) * scale_cm_per_m, 축 대응은 아래 축 설정을 따른다
# 시뮬레이터 화면 표시 Position: (x, y, z) m — y가 높이, x/z가 평면으로 보임 (2026-11-11 스크린샷)
origin_x_m = 0.0         # 지도 원점(왼쪽 아래)에 해당하는 시뮬레이터 x
origin_z_m = 0.0         # 지도 원점(왼쪽 아래)에 해당하는 시뮬레이터 z
scale_cm_per_m = 100.0   # 시뮬레이터 1m가 지도 몇 cm인지
map_x_from = "+x"        # 지도 x(오른쪽)에 대응하는 시뮬레이터 축: "+x" "-x" "+z" "-z"
map_y_from = "+z"        # 지도 y(위쪽)에 대응하는 시뮬레이터 축
