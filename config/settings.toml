# ============================================================
#  드론 제어 시스템 설정 파일
#  - 실제 환경이 확정되면 이 파일의 숫자만 바꾸면 된다.
#  - 중계 서버가 이 파일을 읽어 앱에 `config` 메시지로 전달한다 (docs/api.md 3.1).
#  - 좌표 단위: cm, 원점 = 바닥 지도 왼쪽 아래, x = 오른쪽(동), y = 위쪽(북)
#  - 상태 표시:  [임시] 아직 확정 안 된 값 / [확정] 실측·합의된 값
# ============================================================

[map]
# 바닥에 까는 인쇄 지도의 실제 크기 [임시]
# 파일명 KAIST_2500mm_Map.pdf 기준 가로 250cm, 세로는 지도 영역 비율(1.388:1)로 계산
# "지도"는 PDF의 흰 여백을 뺀 초록색 영역을 말한다 (tools/pdf_to_png.py가 잘라 냄)
width_cm = 250
height_cm = 180
image = "app/assets/map.png"   # 원본: KAIST_2500mm_Map.pdf → tools/pdf_to_png.py로 생성

[home]
# 이륙·귀환 지점 [임시]
x_cm = 20
y_cm = 20

[limits]
max_radius_cm = 250      # home에서 이 거리보다 먼 목표는 거부 [임시]
min_alt_cm = 50          # [임시]
max_alt_cm = 150         # 시연 공간 천장 높이 확인 후 조정 [임시]
default_alt_cm = 80      # [임시]
min_battery_pct = 20     # 이 값 미만이면 출동 거부
link_timeout_s = 3       # 앱 ping이 이 시간 끊기면 자동 착륙

# 금지 구역 없음 (2026-11-11 결정). 필요해지면 아래 형식으로 추가
# [[no_fly_zones]]
# name = "예시"
# polygon_cm = [[100, 100], [130, 100], [130, 130], [100, 130]]

[geo]
# 지도 이미지(app/assets/map.png = PDF의 흰 여백을 뺀 지도 영역) 네 모서리의 위도·경도 (화면 표시용) [확정]
# 산출: tools/georef.py (2026-11-11) — PDF 회색 건물 58개를 KAIST_map.osm 건물과 중심점으로 대응시켜 상사변환 적합
#   - 투영: WGS84 타원체 위 등각 투영(UTM / EPSG:5186 계열). EPSG:3857보다 잔차가 훨씬 작음
#   - 잔차: 평균 0.03 m, 최대 0.70 m (58쌍). 실제 크기 약 619.5 m x 446.4 m, 축척 약 1:248
#   - 지도가 30.0° 회전돼 있다: 이미지 오른쪽(+x)이 동쪽에서 반시계로 30.0°(동북동) 방향
# !! 회전 때문에 sw/ne 두 점만으로 위경도를 선형 보간하면 최대 약 380 m 틀린다.
#    네 모서리 쌍선형 보간을 쓰면 오차 0 (u, v = 0~1 지도 비율 좌표):
#    lat = (1-u)(1-v)·sw + u(1-v)·se + (1-u)v·nw + uv·ne  (lon도 같은 식)
# sw/se/nw/ne는 이미지 기준 모서리(왼쪽아래/오른쪽아래/왼쪽위/오른쪽위)이며 실제 방위가 아니다
sw_lat = 36.3638102
sw_lon = 127.3607256
se_lat = 36.3666003
se_lon = 127.3667053
nw_lat = 36.3672948
nw_lon = 127.3582399
ne_lat = 36.3700849
ne_lon = 127.3642196
rotation_deg = 29.98   # 이미지 +x축이 동쪽에서 반시계로 돈 각도 (참고용)

[backend]
# "sim" = Unity 시뮬레이터, "real" = 실제 RoboMaster TT
mode = "sim"

[sim_calibration]
# 시뮬레이터 좌표(m) ↔ 지도 좌표(cm) 변환 [임시 — 시뮬레이터 실측 후 갱신]
# 지도_cm = (sim_m - origin_m) * scale_cm_per_m, 축 대응은 아래 축 설정을 따른다
# 시뮬레이터 화면 표시 Position: (x, y, z) m — y가 높이, x/z가 평면으로 보임 (2026-11-11 스크린샷)
origin_x_m = 0.0         # 지도 원점(왼쪽 아래)에 해당하는 시뮬레이터 x
origin_z_m = 0.0         # 지도 원점(왼쪽 아래)에 해당하는 시뮬레이터 z
scale_cm_per_m = 100.0   # 시뮬레이터 1m가 지도 몇 cm인지
map_x_from = "+x"        # 지도 x(오른쪽)에 대응하는 시뮬레이터 축: "+x" "-x" "+z" "-z"
map_y_from = "+z"        # 지도 y(위쪽)에 대응하는 시뮬레이터 축

# ------------------------------------------------------------
#  중계 서버 (server/) 설정
# ------------------------------------------------------------
[server]
host = "0.0.0.0"         # 0.0.0.0 = 같은 Wi-Fi의 폰에서 접속 허용
port = 8000
state_hz = 5             # 앱으로 state를 보내는 횟수(초당)

[mock]
# Unity 없이 순수 Python으로 흉내 내는 가짜 드론 (python run_server.py mock)
speed_cm_s = 50                         # 수평 이동 속도
vertical_speed_cm_s = 40                # 이착륙 속도
takeoff_height_cm = 100                 # 이륙 직후 높이 (TT 실제 동작과 비슷하게)
battery_start_pct = 100
battery_drain_flying_pct_per_min = 6    # 비행 중 배터리 감소
battery_drain_idle_pct_per_min = 0.5
time_scale = 1.0                        # 1보다 크면 그만큼 빨리 진행 (테스트용)
